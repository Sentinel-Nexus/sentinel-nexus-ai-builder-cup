name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            services/app/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,app]"
      - name: Ruff
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Repository checks
        run: python scripts/check_repo.py
