[project]
name = "marketsentinel"
version = "0.1.0"
description = "Surveillance and investigation for prediction markets"
requires-python = ">=3.12"
dependencies = ["google-cloud-bigquery", "networkx"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pre-commit", "flask", "matplotlib"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
